<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 — Typography and Media</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../lesson.css">
  <style>
    .fake-photo { min-height: 26rem; background: radial-gradient(circle at 72% 30%, #fff 0 8%, transparent 9%), linear-gradient(140deg, #f9a8d4, #c4b5fd 55%, #a5f3fc); }
  </style>
</head>
<body>
  <nav class="border-bottom py-3"><div class="container"><a href="../index.html">← รวมบทเรียน</a></div></nav>
  <main class="container py-5">
    <span class="badge text-bg-primary">Slides 28–32</span>
    <div class="card border-0 shadow overflow-hidden mt-4">
      <div class="row g-0 align-items-stretch">
        <div class="col-md-5"><div class="fake-photo h-100" role="img" aria-label="ภาพสีไล่ระดับสำหรับสาธิต Media Card"></div></div>
        <div class="col-md-7">
          <div class="card-body p-4 p-lg-5">
            <span class="badge text-bg-success">ใหม่</span>
            <h1 class="display-6 fw-bold lh-sm mt-3">Typography สร้างลำดับชั้น</h1>
            <p class="lead text-body-secondary">ใช้ heading, lead, text-body-secondary และ spacing ให้ผู้อ่านสแกนเนื้อหาได้เร็ว</p>
            <hr class="my-4">
            <div class="d-flex gap-5">
              <div><b class="h2">12</b><div class="small text-body-secondary">Grid columns</div></div>
              <div><b class="h2">6</b><div class="small text-body-secondary">Breakpoints</div></div>
              <div><b class="h2">0</b><div class="small text-body-secondary">jQuery</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="lab-note mt-5"><strong>LAB:</strong> เอา `overflow-hidden`, `shadow` และ `text-body-secondary` ออกทีละ class แล้วอธิบายผล</div>
  </main>
  <script src="../vendor/bootstrap.bundle.min.js"></script>
