<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 — Bootstrap Utilities</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../lesson.css">
</head>
<body class="bg-body-tertiary">
  <nav class="bg-body border-bottom py-3"><div class="container"><a href="../index.html">← รวมบทเรียน</a></div></nav>
  <main class="container py-5">
    <span class="badge text-bg-primary">Slides 22–27</span>
    <h1 class="fw-bold mt-3">Spacing, Display และ Flex</h1>

    <section class="bg-body rounded-4 shadow-sm p-4 p-lg-5 my-4">
      <h2 class="h4">Spacing utilities</h2>
      <div class="d-flex flex-wrap align-items-end gap-4 mt-4">
        <div class="p-2 text-bg-primary rounded">p-2</div>
        <div class="p-3 text-bg-primary rounded">p-3</div>
        <div class="p-5 text-bg-primary rounded">p-5</div>
        <div class="ms-lg-5 p-3 text-bg-dark rounded">ms-lg-5</div>
      </div>
    </section>

    <section class="bg-dark text-white rounded-4 p-4">
      <h2 class="h4">Flex toolbar</h2>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 bg-white text-dark rounded-3 p-3 mt-3">
        <div><strong>Bootstrap Lab</strong><div class="small text-body-secondary">d-flex + gap + alignment</div></div>
        <div class="d-flex gap-2"><button class="btn btn-light">เอกสาร</button><button class="btn btn-primary">เริ่มเรียน</button></div>
      </div>
    </section>

    <div class="lab-note mt-5"><strong>LAB:</strong> เปลี่ยน `flex-md-row` เป็น `flex-lg-row` และทดลอง `justify-content-center`</div>
  </main>
  <script src="../vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
